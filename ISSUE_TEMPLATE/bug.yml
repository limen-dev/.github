name: Bug
description: Something in this repository doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands you ran and their output. Do not paste tokens, keys, or certificates.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Of this repository, and of Limen if it matters.
